# Provisioning service for cPanel / DirectAdmin shared hosting.
#
# Usage:
#   cp .env.example .env      # then fill in real server credentials
#   docker compose up -d --build
#   docker compose logs -f
#
# Use Compose v2 (`docker compose`). The legacy `docker-compose` v1 binary
# cannot talk to Docker Engine 25+ and fails with "KeyError:
# 'ContainerConfig'" AFTER it has already stopped the running container, which
# takes the service down.
#
# SECRET VALUES CONTAINING "$"
#   Compose treats "$NAME" in a value as a variable reference and silently
#   substitutes an empty string, so a password containing "$" would arrive
#   truncated. Store such values with Compose's "$$" escape ($$ -> a literal
#   $). config.py unescapes them for the host so both agree; see
#   _unescape_dollar_values() there. Affects NIC_PASSWORD today.
services:
  provisioner:
    build:
      context: .
      dockerfile: Dockerfile
    image: bt-hosting-provisioner:latest
    container_name: bt_provisioner
    restart: unless-stopped

    # All configuration comes from .env -- credentials never enter the image.
    env_file:
      - .env

    # Bound to loopback on purpose. /api/v1/accounts/create currently has NO
    # authentication, so publishing to 0.0.0.0 would let anyone who can reach
    # this port provision real hosting accounts on your servers and receive the
    # credentials. Use an SSH tunnel to reach it remotely:
    #     ssh -L 8000:127.0.0.1:8000 user@this-host
    # Once API_AUTH_TOKEN is enforced in app.py, change this to "8000:8000".
    ports:
      - "127.0.0.1:8000:8000"

    # SSH private key for the cPanel / DirectAdmin servers, mounted read-only.
    # config.py calls os.path.expanduser() on CPANEL_SSH_KEY_PATH, and the
    # image sets HOME=/home/provisioner, so the in-container path is
    # /home/provisioner/.ssh/id_rsa.
    #
    # Enabled below. Comment out this whole `volumes:` block if you authenticate
    # with passwords instead (set CPANEL_SSH_PASSWORD / DIRECTADMIN_SSH_PASSWORD).
    volumes:
      - ~/.ssh:/home/provisioner/.ssh:ro
      # Surrender evidence (scanned customer letters) and the audit log.
      # This is the only path the service writes to, which is what lets
      # read_only: true stay in place. Keep it backed up: it is the record of
      # who surrendered what, and the only copy of the letters.
      - surrender_data:/app/data
      # The suspension audit trail, written by the suspender job. Must be the
      # SAME volume at the SAME path, or the dashboard reports "no run recorded"
      # while the job is writing records this service cannot see. It is mounted
      # at its own path rather than under /app/data so the two audit trails stay
      # separate.
      - suspension_audit:/app/suspension

    # The root filesystem is read-only: no database, no code uploads, no
    # mutable state outside the volume mounted above. The only writes are
    # surrender evidence and the audit trail, both under /app/data.
    read_only: true
    tmpfs:
      - /tmp

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # Scheduled suspension job
  #
  # Nightly check for hosting accounts whose web-hosting billing has lapsed.
  # Runs in the same image, on the same host, so it reaches nic.bt.bt, the
  # cPanel/DirectAdmin servers and the BSCS portal over the same paths the
  # provisioning service uses.
  #
  # The schedule is in deploy/crontab and is baked into the image. It runs in
  # DRY RUN mode: it reports what it would suspend and changes nothing. Add
  # --live to the crontab command and rebuild once you are satisfied.
  # ---------------------------------------------------------------------
  suspender:
    image: bt-hosting-provisioner:latest
    container_name: bt_suspender
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - provisioner

    # SSH key for the cPanel server, read-only, as the provisioner service uses.
    volumes:
      - ~/.ssh:/home/provisioner/.ssh:ro
      # The suspension audit trail. Must be the SAME volume the suspender
      # writes to, otherwise the dashboard reports "no run recorded" while the
      # job is writing records the web service cannot see.
      - suspension_audit:/app/suspension

    # cron must start as root so it can drop privileges to run the job as
    # "provisioner" -- running cron unprivileged fails with "seteuid:
    # Operation not permitted" and the container crash-loops. The job itself
    # still runs unprivileged, as set in the crontab.
    #
    # The tmpfs mounts are writable by provisioner so the job's own writes work
    # regardless of which user cron ends up using for them.
    #
    # Not read_only, unlike the web service: this container is a job runner that
    # never listens on a port, and cron's write requirements are spread across
    # several paths.
    user: root
    tmpfs:
      - /var/spool/cron:uid=1000,gid=1000,mode=0755
      - /var/run:mode=0755
      - /tmp:mode=1777

    security_opt:
      - no-new-privileges:true

    # -f runs cron in the foreground so the container's lifetime is cron's.
    command: ["cron", "-f"]

    # The image's HEALTHCHECK probes http://127.0.0.1:8000/api/v1/health, which
    # this container does not serve -- it runs cron, not the web service, so it
    # inherited a check that can never pass and reported "unhealthy" forever.
    # It is disabled rather than left failing.
    #
    # There is no useful substitute here: docker already knows whether PID 1
    # (cron) is alive, and whether a scheduled run actually succeeded is a
    # property of the audit log, not of the process.
    healthcheck:
      disable: true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Named volume holding surrender letters and the audit trail. Survives
  # `docker compose down` and image rebuilds.
  surrender_data:
  # Named volume for the suspension audit trail, kept apart from the surrender
  # evidence so the two record shapes do not end up in one file.
  suspension_audit:
